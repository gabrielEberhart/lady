[package]
name = "lady"
version = "0.1.0"
edition = "2024"
description = "Locally-hosted database management tool"

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dependencies.tokio]
version = "1.54.1"
features = ["net", "io-util", "rt-multi-thread", "macros", "time"]
