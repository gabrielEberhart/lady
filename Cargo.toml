[package]
name = "lady"
version = "0.1.0"
edition = "2024"
description = "Locally-hosted database management tool"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
mysql_async = "0.37.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dependencies.tokio]
version = "1.54.1"
features = ["net", "io-util", "rt-multi-thread", "macros", "time"]
